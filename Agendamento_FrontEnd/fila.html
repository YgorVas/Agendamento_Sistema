<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar na fila | Agendai</title>
    <link rel="stylesheet" href="/assets/cliente.css">
    <script type="module" src="/assets/fila-publica.mjs"></script>
</head>
<body>
    <main>
        <p id="estabelecimento" class="estabelecimento" hidden></p>
        <h1>Entrar na fila</h1>
        <p id="mensagem" role="status">Carregando serviços…</p>
        <form id="entrada" hidden>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" autocomplete="given-name" maxlength="100" pattern=".*\S.*" required>
            <label for="sobrenome">Sobrenome</label>
            <input id="sobrenome" name="sobrenome" autocomplete="family-name" maxlength="100" pattern=".*\S.*" required>
            <label for="whatsapp">WhatsApp com DDD</label>
            <input id="whatsapp" name="telefone_whatsapp" autocomplete="tel-national" placeholder="82 988887777" title="Exemplo: 82 988887777" pattern="[0-9]{2} 9[0-9]{8}" required>
            <fieldset id="servicos">
                <legend>Serviços</legend>
                <p>Selecione pelo menos um serviço.</p>
                <div id="opcoes-servicos"></div>
            </fieldset>
            <button type="submit">Entrar na fila</button>
        </form>
    </main>
</body>
</html>
